<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Feed Log</title>
<meta name="theme-color" content="#fdf3ec">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Feed Log">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
<link rel="icon" href="icons/icon-192.png?v=3">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=3">
<style>
  :root {
    color-scheme: light;
    --bg: #fdf3ec; --card: #ffffff; --card2: #f7efe8; --line: #eadfd5;
    --text: #24396b; --dim: #5f6f93; --muted: #9aa5bf;
    --accent: #24396b;          /* navy: buttons, outlines, active states */
    --pink: #d9674f;            /* warm coral accent for small labels */
    --yellow: #f9c846; --coral: #f2a28e; --sky: #a9d8ea; --soft: #dceff7;
    --left: #3d82c4; --right: #d64b3f; --bottle: #f2b632;   /* Left blue, Right red (matches the L / R letters) */
    --ok: #3a9a66; --amber: #c9851c; --red: #d2524c;
    --nav: #ffffff;
    --serif: 'Fraunces', Georgia, 'Times New Roman', serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font: 17px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: max(14px, env(safe-area-inset-top)) 16px calc(96px + env(safe-area-inset-bottom));
    max-width: 560px; margin: 0 auto; user-select: none; -webkit-user-select: none;
  }
  button { font: inherit; color: inherit; border: 0; cursor: pointer; background: none; }
  input { font: inherit; color: var(--text); }
  img.flip { transform: scaleX(-1); }

  /* header */
  .top { display: flex; align-items: center; gap: 16px; margin: 8px 4px 18px; }
  .top h1 { font-family: var(--serif); font-size: 38px; font-weight: 500; margin: 0; line-height: 1.05; }
  .top .age { color: var(--dim); font-size: 16px; margin-top: 2px; }
  .avatar { width: 76px; height: 76px; border-radius: 50%; overflow: hidden; padding: 0; flex: none; background: var(--soft); box-shadow: 0 0 0 3px #fff; }
  .avatar img { width: 100%; height: 100%; display: block; object-fit: cover; }
  .top .who { flex: 1; min-width: 0; }
  .top h1 button { font: inherit; text-align: left; padding: 0; overflow-wrap: anywhere; }
  .gear { flex: none; align-self: flex-start; width: 40px; height: 40px; border-radius: 50%; background: var(--card); color: var(--dim); font-size: 22px; line-height: 1; box-shadow: 0 1px 0 var(--line); }
  .ptitle { font-family: var(--serif); font-size: 34px; font-weight: 500; margin: 4px 4px 16px; }

  /* sections with a coloured header band (Feed, Sleep) */
  .sec { background: var(--card); border-radius: 22px; overflow: hidden; margin-bottom: 16px; box-shadow: 0 1px 0 var(--line), 0 6px 18px rgba(36, 57, 107, .06); }
  .sechead { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; font-family: var(--serif); font-size: 26px; font-weight: 500; }
  .sec-feed .sechead { background: var(--yellow); }
  .sec-sleep .sechead { background: var(--sky); }
  .plus { width: 46px; height: 46px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 30px; line-height: 1; font-family: inherit; }
  .secbody { padding: 14px 16px 16px; }
  #status, #due { padding: 4px 2px 10px; }
  #due { border-top: 1px solid var(--line); padding-top: 12px; margin-top: 4px; }

  .card { background: var(--card); border-radius: 22px; padding: 16px 18px; margin-bottom: 14px; box-shadow: 0 1px 0 var(--line), 0 6px 18px rgba(36, 57, 107, .06); }
  .label { font-family: var(--serif); color: var(--text); font-size: 21px; font-weight: 500; }
  .value { font-size: 22px; font-weight: 700; margin-top: 2px; }
  .value small { font-size: 15px; font-weight: 400; color: var(--dim); }
  .value.late { color: var(--amber); }
  .label-row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .caps-link { color: var(--accent); font-size: 12px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; padding: 4px 0; text-decoration: underline; text-underline-offset: 3px; }
  .fine { color: var(--dim); font-size: 13px; margin: 6px 0 0; }

  /* big outlined buttons */
  .bigbtn { position: relative; width: 100%; background: var(--card); border: 2px solid var(--accent); border-radius: 24px;
            color: var(--accent); font-family: var(--serif); font-weight: 500; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
  .bigbtn:active { transform: scale(.98); background: var(--card2); }
  .bigbtn img { width: 64px; height: 64px; object-fit: contain; }
  .bicon { display: inline-flex; align-items: center; gap: 4px; }
  .bicon b, .lr { font-family: -apple-system, sans-serif; font-size: 20px; font-weight: 900; }
  .bigbtn small { font-family: -apple-system, sans-serif; font-size: 18px; font-weight: 600; color: var(--dim); }
  .badge { position: absolute; top: 12px; left: 12px; width: 32px; height: 32px; border-radius: 50%; background: var(--accent);
           color: #fff; font-size: 18px; font-weight: 800; display: grid; place-items: center; font-family: -apple-system, sans-serif; }
  .sides { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 6px 0 12px; }
  .sides .bigbtn { min-height: 190px; font-size: 34px; }
  .sides .bigbtn .hint { font-family: -apple-system, sans-serif; font-size: 13px; font-weight: 600; color: var(--dim); min-height: 17px; }
  .bottlebtn { min-height: 70px; font-size: 24px; flex-direction: row; gap: 10px; margin-bottom: 8px; }
  .bottlebtn img { width: 40px; height: 40px; }

  .tgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 6px 0 10px; }
  .tcol { display: grid; gap: 12px; }
  .tcol .bigbtn { min-height: 130px; font-size: 36px; }
  .tgrid .tall { min-height: 272px; font-size: 40px; }
  .clock { text-align: center; font-size: 54px; font-weight: 700; font-variant-numeric: tabular-nums; margin: 14px 0 2px; }
  .sidetot { text-align: center; color: var(--dim); font-variant-numeric: tabular-nums; }
  .warn { background: #fff4dc; color: var(--amber); border-radius: 14px; padding: 10px 12px; font-weight: 600; margin-bottom: 10px; text-align: center; }
  .link { color: var(--accent); font-weight: 600; padding: 10px 12px; text-decoration: underline; text-underline-offset: 3px; }
  .center { text-align: center; }
  .stale { margin-top: 10px; padding: 12px; border-radius: 16px; background: var(--card2); font-size: 14px; color: var(--dim); }

  /* sleep switch */
  .seg2 { display: grid; grid-template-columns: 1fr 1fr; background: var(--card2); border-radius: 18px; padding: 4px; gap: 4px; }
  .seg2 button { display: flex; align-items: center; justify-content: center; gap: 8px; height: 60px; border-radius: 14px; font-family: var(--serif); font-size: 22px; color: var(--dim); }
  .seg2 button img { width: 34px; height: 34px; object-fit: contain; opacity: .55; }
  .seg2 button.on { background: var(--card); color: var(--accent); box-shadow: 0 2px 8px rgba(36, 57, 107, .12); }
  .seg2 button.on img { opacity: 1; }
  .sleepnow { font-size: 19px; margin: 14px 2px 4px; }
  .sleepnow small { color: var(--dim); font-size: 14px; }
  .sleepfacts { color: var(--dim); font-size: 15px; line-height: 1.5; margin: 6px 2px 0; }
  .sleepfacts b, .sleepnow b { color: var(--text); }
  .sclock { display: block; width: 100%; text-align: center; padding: 14px 0 6px; }
  .sclabel { display: block; font-family: var(--serif); font-size: 20px; color: var(--dim); }
  .sclockv { display: block; font-size: 50px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .sclock small { color: var(--dim); font-size: 13px; }
  .sleeptoday { margin: 12px 2px 0; padding-top: 12px; border-top: 1px solid var(--line); font-size: 17px; }
  .col .cs { background: var(--sky); border-radius: 4px 4px 0 0; }

  /* logs */
  .chips { display: flex; gap: 12px; overflow-x: auto; margin: 0 -16px 18px; padding: 2px 16px; scrollbar-width: none; }
  .chip { flex: none; background: var(--card); border: 2px solid var(--accent); border-radius: 40px; height: 62px; padding: 0 18px;
          display: flex; align-items: center; gap: 4px; color: var(--accent); }
  .chip img { width: 34px; height: 34px; object-fit: contain; }
  .chip .plus { width: auto; height: auto; background: none; color: var(--accent); font-size: 28px; margin-left: 6px; }
  .L { color: var(--left); } .R { color: var(--right); }
  .dayhead { font-family: var(--serif); font-size: 18px; margin: 18px 4px 8px; }
  .entry { display: grid; grid-template-columns: 74px 1fr; align-items: center; gap: 8px; width: 100%; text-align: left;
           background: var(--card); border-radius: 18px; padding: 12px 14px 12px 8px; margin-bottom: 8px; box-shadow: 0 1px 0 var(--line); }
  .entry .ic { position: relative; display: flex; justify-content: center; align-items: center; }
  .entry .ic img { width: 48px; height: 48px; object-fit: contain; }
  .entry .ic.two img { width: 34px; height: 34px; margin: 0 -3px; }
  .entry .ic { gap: 2px; }
  .entry .ic .lt { font-size: 15px; font-weight: 900; }
  .entry .time { font-size: 21px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .entry .what { font-size: 16px; }
  .entry .gap { font-size: 14px; color: var(--dim); }
  .entry.sleep { background: #f3f9fc; }
  .empty { color: var(--dim); text-align: center; padding: 26px; }

  /* analysis */
  .q { padding: 12px 0; border-bottom: 1px solid var(--line); }
  .q:first-child { padding-top: 0; }
  .q:last-of-type { border-bottom: 0; }
  .qh { font-weight: 700; margin-bottom: 6px; }
  .pill { display: inline-block; padding: 2px 10px; border-radius: 999px; font-weight: 700; background: var(--card2); }
  .split { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .split b { display: block; font-size: 24px; }
  .split small { display: block; color: var(--dim); font-size: 13px; }
  .chart { width: 100%; height: auto; display: block; margin: 8px 0 4px; touch-action: manipulation; }
  .chart text { fill: var(--muted); font-size: 10px; font-family: inherit; }
  .chart .cl { stroke: #d9cfc6; stroke-width: 1; fill: none; }
  .chart .cl.mid { stroke: #b9aea3; stroke-width: 1.5; }
  .chart .grid { stroke: #f1e8e0; stroke-width: 1; }
  .chart .her { stroke: #e0735c; stroke-width: 2.5; fill: none; }
  .chart .proj { stroke: #e0735c; stroke-width: 2; stroke-dasharray: 4 4; fill: none; }
  .chart .dot { fill: #e0735c; stroke: #fff; stroke-width: 2; }
  .chart .dot.open { fill: #fff; stroke: #e0735c; }
  .chart .lab { fill: var(--dim); }
  .tip { min-height: 20px; font-size: 14px; font-variant-numeric: tabular-nums; }
  .facts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
  .fact { background: var(--card2); border-radius: 14px; padding: 10px 12px; }
  .fact b { display: block; font-size: 22px; }
  .fact span { color: var(--dim); font-size: 13px; }
  .verdict { display: flex; gap: 10px; align-items: center; padding: 12px 14px; border-radius: 14px; font-weight: 600; margin: 4px 0 14px; }
  .verdict .vi { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-weight: 900; color: #fff; flex: none; }
  .verdict.good { background: #e6f4ec; } .verdict.good .vi { background: var(--ok); }
  .verdict.watch { background: #fff4dc; } .verdict.watch .vi { background: var(--amber); }
  .verdict.none { background: var(--card2); } .verdict.none .vi { background: var(--muted); }
  .sig { margin-bottom: 16px; }
  .sig-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .sig-name { font-weight: 700; }
  .sig-val { color: var(--dim); font-size: 14px; text-align: right; }
  .okpill, .lowpill { padding: 2px 10px; border-radius: 999px; font-weight: 800; }
  .okpill { background: #e6f4ec; color: var(--ok); }
  .lowpill { background: #fff4dc; color: var(--amber); }
  .mix { position: relative; display: flex; height: 22px; border-radius: 11px; overflow: hidden; background: var(--card2); margin: 8px 0 4px; }
  .mix i { display: block; height: 100%; }
  .mix .mb { background: var(--left); } .mix .mo { background: var(--bottle); }
  .mix .mt { background: repeating-linear-gradient(135deg, var(--left) 0 6px, var(--bottle) 6px 12px); }
  .tick { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--text); }
  .keys { display: flex; flex-wrap: wrap; gap: 4px 12px; color: var(--dim); font-size: 12px; }
  .keys i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }
  .gain { position: relative; height: 16px; background: var(--card2); border-radius: 8px; margin: 6px 0 2px; }
  .gain b { position: absolute; inset: 0 auto 0 0; border-radius: 8px; background: #e0735c; }
  .barlab { display: flex; justify-content: space-between; color: var(--dim); font-size: 12px; }
  .twk { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
  .twk div { background: var(--card2); border-radius: 12px; padding: 8px 10px; }
  .twk b { display: block; font-size: 18px; white-space: nowrap; }
  .twk span { color: var(--dim); font-size: 12px; }

  /* milk bar (top of every page but Analysis) and the goal card */
  #milkbar { display: block; width: 100%; position: relative; overflow: hidden; height: 34px; border-radius: 17px; margin: 0 0 12px;
             background: var(--card); text-align: left; padding: 0 14px; font-size: 14px; font-weight: 700; color: var(--text); box-shadow: 0 1px 0 var(--line); }
  #milkbar .mfill { position: absolute; inset: 0 auto 0 0; background: var(--soft); }
  #milkbar span { position: relative; line-height: 34px; }
  #milkbar.done { background: var(--yellow); }
  #milkbar.done .mfill { display: none; }
  .goalcard { border-radius: 22px; padding: 18px; margin-bottom: 14px; background: var(--card); box-shadow: 0 1px 0 var(--line), 0 6px 18px rgba(36, 57, 107, .06); }
  .goalcard .big { font-family: var(--serif); font-size: 36px; font-weight: 500; line-height: 1.1; }
  .goalcard.done { background: linear-gradient(135deg, var(--yellow) 0%, #fbd977 55%, var(--coral) 130%); text-align: center; }
  .goalcard.done .fine { color: var(--text); }
  .goalcard .party { font-size: 46px; line-height: 1; margin-bottom: 6px; }

  /* last 7 days */
  .cols { position: relative; height: 150px; display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; align-items: end; margin: 12px 0 4px; }
  .cols .band { position: absolute; left: -4px; right: -4px; z-index: 2; pointer-events: none;
                background: rgba(58, 154, 102, .14); border-top: 2px solid var(--ok); border-bottom: 2px solid var(--ok); }
  .cols .bandlab { position: absolute; right: -2px; z-index: 3; transform: translateY(-100%); font-size: 10px; font-weight: 800; color: var(--ok); }
  .col { position: relative; display: flex; flex-direction: column-reverse; height: 100%; }
  .col i { display: block; width: 100%; }
  .col .cb { background: var(--left); border-radius: 0 0 4px 4px; }
  .col .co { background: var(--bottle); border-radius: 4px 4px 0 0; }
  .col em { z-index: 4; position: absolute; left: 0; right: 0; text-align: center; font-style: normal; font-size: 10px; color: var(--dim); }
  .collabs { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; text-align: center; color: var(--dim); font-size: 11px; }
  .finds { margin: 12px 0 0; padding-left: 18px; }
  .finds li { margin: 6px 0; }
  .srow { display: grid; grid-template-columns: 44px 1fr; align-items: center; gap: 8px; margin-bottom: 8px; }
  .sday { color: var(--dim); font-size: 13px; font-weight: 700; }
  .track { position: relative; height: 22px; background: var(--card2); border-radius: 6px; overflow: hidden; }
  .blk { position: absolute; top: 0; bottom: 0; border-radius: 2px; }
  .blk.L { background: var(--left); } .blk.R { background: var(--right); }
  .blk.bottle { background: var(--bottle); top: 4px; bottom: 4px; }
  .nowline { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--text); opacity: .5; }
  .ticks { position: relative; height: 16px; margin-left: 52px; color: var(--dim); font-size: 11px; }
  .ticks span { position: absolute; transform: translateX(-50%); }
  .ticks span:first-child { transform: none; }
  .legend { display: flex; gap: 14px; color: var(--dim); font-size: 13px; margin-top: 8px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; background: var(--c); }

  /* growth: weigh-ins */
  .wtable { width: 100%; border-collapse: collapse; margin-top: 10px; font-variant-numeric: tabular-nums; }
  .wtable th { color: var(--dim); font-size: 12px; font-weight: 600; text-align: right; padding: 4px 4px 8px; }
  .wtable th:first-child, .wtable td:first-child { text-align: left; }
  .wtable td { padding: 9px 4px; border-top: 1px solid var(--line); text-align: right; font-size: 15px; }
  .wtable td.up { color: var(--ok); } .wtable td.down { color: var(--red); }
  .wtable tr.ignored td { color: var(--muted); text-decoration: line-through; }
  .wtable .x { background: var(--card2); width: 30px; height: 30px; border-radius: 9px; color: var(--dim); }
  .addbtn { width: 100%; height: 52px; border-radius: 16px; border: 2px solid var(--accent); color: var(--accent); font-weight: 700; margin-top: 12px; background: var(--card); }

  /* milestones */
  .ms-week { font-family: var(--serif); color: var(--text); font-size: 24px; font-weight: 500; }
  .ms-age { color: var(--dim); font-size: 15px; }
  .ms-theme { font-family: var(--serif); font-style: italic; color: var(--pink); font-size: 20px; margin: 2px 0; }
  .ms-focus { margin-top: 16px; padding: 14px; border-radius: 16px; background: var(--card2); border-left: 4px solid var(--pink); }
  .ms-focus h3 { font-family: var(--serif); font-weight: 500; font-size: 20px; margin: 2px 0 6px; color: var(--text); }
  .ms-text { font-size: 18px; margin: 10px 0 4px; }
  .ms-list { margin: 8px 0 0; padding-left: 20px; }
  .ms-list li { margin: 4px 0; }
  .ms-try { margin-top: 12px; padding: 12px; border-radius: 14px; background: var(--card2); }
  .ms-part { margin-top: 16px; }
  .ms-part .qh { margin-bottom: 4px; }
  .ms-part.ms-try { margin-top: 12px; }
  .ms-guide { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 6px 0 8px; }
  .ms-guide div { padding: 8px 10px; border-radius: 12px; background: var(--card2); }
  .ms-guide span { display: block; font-size: 12px; color: var(--dim); }
  .ms-guide b { display: block; font-size: 15px; line-height: 1.25; }
  .ms-srcs { margin-top: 16px; font-size: 13px; color: var(--dim); }
  .ms-srcs summary { cursor: pointer; text-decoration: underline; text-underline-offset: 3px; list-style: none; }
  .ms-srcs summary::-webkit-details-marker { display: none; }
  .ms-srcs ul { margin: 8px 0 0; padding-left: 18px; }
  .ms-srcs li { margin: 4px 0; }
  .ms-srcs a { color: var(--dim); }
  .msstack { position: relative; }
  .msback { position: absolute; inset: 10px 10px -8px; transform: rotate(-2deg); opacity: .6; }
  .mscard { position: relative; touch-action: pan-y; user-select: none; -webkit-user-select: none; transition: transform .25s ease; will-change: transform; }
  .mscard.dragging { transition: none; }
  .mscard.flying { transition: transform .11s ease-in; }
  .mscard.in-right { animation: msInR .15s ease-out; }
  .mscard.in-left { animation: msInL .15s ease-out; }
  @keyframes msInR { from { transform: translateX(24px) scale(.98); opacity: .5; } }
  @keyframes msInL { from { transform: translateX(-24px) scale(.98); opacity: .5; } }
  @media (prefers-reduced-motion: reduce) { .mscard, .mscard.flying { transition: none; } .mscard.in-right, .mscard.in-left { animation: none; } }
  .ms-try b { color: var(--pink); }
  .msnav { display: flex; align-items: center; gap: 8px; margin: 0 0 12px; }
  .msnav .arrow { flex: none; width: 40px; height: 40px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 24px; font-weight: 700; }
  .msnav .arrow:disabled { opacity: .25; }
  .mschips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; flex: 1; padding: 2px; }
  .mschip { flex: none; height: 36px; padding: 0 12px; border-radius: 18px; background: var(--card); color: var(--dim); font-size: 14px; font-weight: 700; border: 1.5px solid var(--line); }
  .mschip.now { border-color: var(--pink); color: var(--pink); }
  .mschip.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .msimg { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 18px; margin: 4px 0 12px; background: var(--bg); }
  .mstag { display: inline-block; font-family: -apple-system, sans-serif; font-size: 11px; font-weight: 800; letter-spacing: .5px; text-transform: uppercase; padding: 3px 8px; border-radius: 999px; background: var(--card2); color: var(--dim); margin-left: 8px; vertical-align: 4px; }
  .mstag.now { background: #fde4dc; color: var(--pink); }

  /* bottom tab bar */
  .tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: var(--nav); border-top: 1px solid var(--line);
            padding: 8px 4px calc(8px + env(safe-area-inset-bottom)); }
  .tabbar .in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }
  .tab { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--dim); font-size: 12px; padding: 2px 0; white-space: nowrap; min-width: 0; }
  .tab .pillbg { width: 60px; height: 34px; border-radius: 17px; display: grid; place-items: center; }
  .tab svg { width: 25px; height: 25px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .tab.on { color: var(--text); font-weight: 700; }
  .tab.on .pillbg { background: var(--soft); }

  /* bottom sheet and forms */
  .scrim { position: fixed; inset: 0; background: rgba(36, 57, 107, .35); display: none; z-index: 10; }
  .scrim.open { display: block; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; max-width: 560px; margin: 0 auto; z-index: 11;
           background: var(--card); border-radius: 24px 24px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom));
           transform: translateY(105%); transition: transform .18s ease-out; max-height: 92vh; overflow-y: auto; }
  .sheet.open { transform: none; }
  .sheet h3 { font-family: var(--serif); font-weight: 500; margin: 0 0 14px; font-size: 26px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
  .row label { color: var(--dim); font-weight: 600; min-width: 64px; }
  .field { width: 100%; height: 54px; background: var(--bg); border: 1.5px solid var(--line); border-radius: 14px;
           padding: 12px; font-size: 18px; user-select: text; -webkit-user-select: text; }
  .tbox, .nbox { display: flex; align-items: center; gap: 10px; flex: 1; justify-content: flex-end; }
  .tbox input { max-width: 150px; font-size: 24px; font-weight: 800; text-align: center; height: 58px; }
  .tbox small { color: var(--dim); min-width: 64px; }
  .twarn { margin: -4px 0 10px; padding: 10px 12px; border-radius: 12px; background: #fde4dc; color: var(--red); font-size: 15px; font-weight: 600; }
  .twarn button { margin-top: 8px; width: 100%; }
  .nbox input { max-width: 120px; font-size: 26px; font-weight: 800; text-align: center; height: 58px; }
  .nbox span { color: var(--dim); font-weight: 700; min-width: 34px; }
  .choices { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .choice { height: 60px; border-radius: 16px; background: var(--card2); border: 2px solid transparent; font-weight: 700; font-size: 15px; line-height: 1.1; }
  .choice.on { border-color: var(--accent); background: var(--soft); }
  .confirm { width: 100%; height: 60px; border-radius: 30px; background: var(--accent); color: #fff; font-size: 20px; font-weight: 700; margin-top: 6px; }
  .confirm.danger-bg { background: var(--red); }
  .secondary { width: 100%; height: 52px; border-radius: 26px; background: var(--card2); font-weight: 700; margin-top: 10px; }
  .secondary.inline { width: auto; padding: 0 18px; margin: 0; flex: none; height: 54px; }
  .danger { color: var(--red); }
  .set-label { display: block; color: var(--dim); font-weight: 600; margin: 12px 0 6px; font-size: 15px; }
  .wlist { list-style: none; padding: 0; margin: 10px 0; }
  .wlist li { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .wlist .x { background: var(--card2); width: 36px; height: 36px; border-radius: 10px; }
  .toast { position: fixed; left: 50%; top: calc(12px + env(safe-area-inset-top)); transform: translateX(-50%);
           background: var(--red); color: #fff; padding: 10px 16px; border-radius: 12px; font-weight: 700; z-index: 20; display: none; max-width: 90vw; }
</style>
</head>
<body>
  <button id="milkbar" hidden></button>
  <header class="top">
    <button class="avatar" id="photoBtn" aria-label="Change photo"><img id="avatarImg" src="icons/style/avatar.svg" alt=""></button>
    <input type="file" id="photoFile" accept="image/*" hidden>
    <div class="who"><h1><button id="babyName" aria-label="Change name">Feed Log</button></h1><div class="age" id="age"></div></div>
    <button class="gear" id="settingsBtn" aria-label="Settings">⚙︎</button>
  </header>

  <section class="page" data-page="timer">
    <section class="sec sec-feed">
      <div class="sechead"><span>Feed</span><button class="plus" id="feedPlus" aria-label="Add a feed">+</button></div>
      <div class="secbody">
        <div id="status"></div>
        <section id="timer" hidden></section>
        <section id="buttons">
          <div class="sides">
            <button class="bigbtn" data-side="L"><span class="badge" hidden>✓</span><span class="bicon"><b class="L">L</b><img src="icons/style/breast.svg" alt=""></span>Left<span class="hint"></span></button>
            <button class="bigbtn" data-side="R"><span class="badge" hidden>✓</span><span class="bicon"><img src="icons/style/breast.svg" alt=""><b class="R">R</b></span>Right<span class="hint"></span></button>
          </div>
          <button class="bigbtn bottlebtn" id="bottleBtn"><img src="icons/style/i_bottle.png" alt="">Bottle</button>
        </section>
        <div id="due"></div>
      </div>
    </section>
    <section class="sec sec-sleep" id="sleepCard"></section>
  </section>

  <section class="page" data-page="logs" hidden>
    <h2 class="ptitle" id="logsTitle">Logs</h2>
    <div class="chips">
      <button class="chip" id="addBreast" aria-label="Add a breast feed"><b class="L lr">L</b><img src="icons/style/breast.svg" alt=""><b class="R lr">R</b><span class="plus">+</span></button>
      <button class="chip" id="addBottle" aria-label="Add a bottle"><img src="icons/style/i_bottle.png" alt=""><span class="plus">+</span></button>
    </div>
    <div id="timeline"></div>
    <div id="logsMore" style="margin-top:6px"></div>
  </section>

  <section class="page" data-page="growth" hidden>
    <h2 class="ptitle">Growth</h2>
    <section class="card" id="growth"></section>
    <section class="card" id="weighins"></section>
  </section>

  <section class="page" data-page="analysis" hidden>
    <h2 class="ptitle">Analysis</h2>
    <section id="goal"></section>
    <section class="card" id="analysis"></section>
    <section class="card"><div class="label">Last 7 days</div><div id="week"></div>
      <div class="qh" style="margin-top:16px">When she fed</div><div id="strip" style="margin-top:8px"></div></section>
    <section class="card" id="sleepStats"></section>
  </section>

  <section class="page" data-page="milestones" hidden>
    <h2 class="ptitle">Milestones</h2>
    <div id="milestones"></div>
  </section>

  <nav class="tabbar"><div class="in">
    <button class="tab" data-go="timer"><span class="pillbg"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 13l3-3M10 2h4"/></svg></span>Feed Timer</button>
    <button class="tab" data-go="logs"><span class="pillbg"><svg viewBox="0 0 24 24"><circle cx="6" cy="7" r="2.5"/><path d="M11 6h9M11 9h6M4 14h16M4 18h16"/></svg></span>Logs</button>
    <button class="tab" data-go="growth"><span class="pillbg"><svg viewBox="0 0 24 24"><path d="M3 20h18M4 16l5-5 4 3 7-8"/><path d="M15 6h5v5"/></svg></span>Growth</button>
    <button class="tab" data-go="analysis"><span class="pillbg"><svg viewBox="0 0 24 24"><path d="M6 3h9l3 3v8M6 3v18h7M9 8h6M9 12h4"/><circle cx="17" cy="17" r="3"/><path d="M19.2 19.2L21 21"/></svg></span>Analysis</button>
    <button class="tab" data-go="milestones"><span class="pillbg"><svg viewBox="0 0 24 24"><path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.4 6.7 19.4l1.2-6L3.4 9.3l6-.7z"/></svg></span>Milestones</button>
  </div></nav>

  <div class="scrim" id="scrim"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
  <div class="toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="logic.js"></script>
  <script src="sync.js"></script>
  <script src="milestones.js"></script>
  <script src="history.js"></script>
  <script src="app.js"></script>
</body>
</html>
